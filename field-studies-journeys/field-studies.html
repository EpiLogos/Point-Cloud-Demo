:root{
  --paper:#f5f3ea;
  --ink:#25251e;
  --muted:#6f725f;
  --line:rgba(28,31,24,.16);
  --panel:rgba(250,248,242,.9);
  --panel-strong:rgba(250,248,242,.98);
  --accent:#8d5f4d;
  --accent-soft:#b68879;
  --wash:rgba(74,82,64,.055);
  --shadow:0 22px 60px #1c2a1817;
  --sans: "Avenir Next", "Avenir", "Segoe UI", "Trebuchet MS", "Helvetica Neue", sans-serif;
  --serif: "Canela Deck", "Georgia", "Times New Roman", serif;
}

body{
  background:
    radial-gradient(circle at 0% 0%, rgba(255,255,255,.35), transparent 35%),
    radial-gradient(circle at 100% 35%, rgba(255,255,255,.2), transparent 45%),
    linear-gradient(170deg, rgba(240,237,229,.95), var(--paper) 48%, #efece4 100%);
}

.chrome{
  border:1px solid var(--line);
  border-radius:18px;
  background:linear-gradient(155deg,var(--panel),rgba(248,246,240,.86));
  box-shadow:0 12px 30px #181f1420;
  backdrop-filter:blur(18px);
}

#grain{
  opacity:.026;
  mix-blend-mode: multiply;
}

#stage{
  background:radial-gradient(circle at 70% 5%,rgba(255,255,255,.15),transparent 28%), var(--paper);
}

.masthead{left:34px;right:34px;top:30px;pointer-events:none}
.masthead>*{pointer-events:auto}
.wordmark{gap:12px}
.wordmark .brand{letter-spacing:.15em;text-transform:uppercase;font-size:9px;line-height:1.2}
.wordmark .edition{font-size:7px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}

.journey-title-button{background:linear-gradient(145deg,var(--panel-strong),rgba(255,255,255,.9));border:1px solid var(--line);backdrop-filter:blur(12px)}

.header-actions .text-button{letter-spacing:.02em}

.instrument{
  height:52px;
  padding:7px 12px;
  border-radius:999px;
  box-shadow:0 12px 30px #10140a22;
}

.icon-button{
  width:34px;
  height:34px;
  min-width:34px;
  border-radius:999px;
  transition:transform .16s ease,color .16s ease,background .16s ease;
}

.icon-button:hover:not(:disabled){color:var(--ink);transform:translateY(-1px)}
.icon-button:active:not(:disabled){transform:translateY(0)}

.study-picker{padding:6px 8px}

.tool-rail{
  left:22px;
  top:102px;
  gap:5px;
  border-radius:18px;
  padding:8px;
  box-shadow:var(--shadow);
}

.tool-rail .icon-button{width:34px;height:34px}

.view-controls{left:94px;top:86px;border-radius:15px;padding:4px}
.view-controls button,
.view-controls select{
  border-radius:11px;
  padding:5px 10px;
  font-size:10px;
  font-weight:500;
}

.coordinate-readout{top:126px;left:116px;font-size:9px;opacity:.8}

.tool-hint{
  border-radius:999px;
  background:linear-gradient(155deg,#f9f7f1,rgba(255,255,255,.86));
  font-size:10px;
  padding:10px 14px;
  box-shadow:0 10px 28px #12160d18;
}

.inspector{
  width:min(360px, calc(100vw - 30px));
  top:88px;
  right:18px;
  bottom:98px;
  border-radius:16px;
  border:1px solid rgba(31,34,28,.16);
  backdrop-filter:blur(20px);
  box-shadow:0 25px 50px #2226171a;
}

.inspector-heading{padding:18px 20px 13px}
.inspector-heading h2{font:34px/1 var(--serif);letter-spacing:-.03em}
.eyebrow{text-transform:uppercase;letter-spacing:.16em}

.inspector-search{font-size:11px;padding:10px 16px}
.inspector-content{padding:18px 18px 12px}

.scope-tabs button{
  border-radius:10px;
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:.09em;
}

.inspector-footer{padding:11px 18px;border-radius:0 0 16px 16px}

.section-heading h3{font-family:var(--serif);font-size:22px;letter-spacing:-.025em}

.material-card,.shape-choices button,.scene-add,.layout-grid button,.secondary,.primary,.control-group summary,.automation-lane,.capture-option,.capture-option.featured{
  border-radius:12px;
}

.range-control{
  border-radius:12px;
  background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(245,243,237,.3));
  border:1px solid var(--line);
  padding:7px 10px 9px;
  border-radius:11px;
}

.object-list{border-radius:12px;overflow:hidden}
.object-row{transition:background .15s ease}

.timeline-panel{
  width:min(980px,calc(100vw - 60px));
  border-radius:16px;
  background:linear-gradient(165deg,rgba(252,250,243,.96),rgba(245,244,239,.92));
  box-shadow:0 20px 55px #1f2a1a22;
}

.timeline-panel .scene-card{min-width:132px}
.scene-thumb{border-radius:10px}

.shape-picker{
  left:90px;
  top:102px;
  border-radius:14px;
  box-shadow:var(--shadow);
  background:linear-gradient(165deg,rgba(250,248,243,.98),rgba(244,241,232,.97));
}

.shape-picker h3{font-size:27px;line-height:1.02}

.modal{
  border-radius:18px;
  width:min(680px,calc(100vw - 40px));
  max-height:min(88svh,760px);
  box-shadow:0 35px 95px #14191230;
}

.toast{box-shadow:0 14px 32px #191f1820}

.present-return{border-radius:999px;background:linear-gradient(150deg,var(--panel-strong),rgba(251,248,242,.9));}

.recording-badge{border-radius:999px;padding:8px 14px;font-size:10px}

@media(min-width:1650px){
  .inspector{right:32px;width:372px}
  .tool-rail{top:124px}
  .inspector-heading h2{font-size:36px}
  .shape-picker{left:106px}
}

@media(max-width:1050px){
  .masthead{left:22px;right:22px}
  .inspector{right:14px;width:310px}
  .tool-hint{left:42%}
  .coordinate-readout{left:94px}
}

@media(max-width:760px){
  .masthead{left:18px;right:18px;top:22px}
  .journey-title-button{display:none}
  .gesture-note{bottom:144px;right:18px}
  .inspector{width:min(330px,calc(100vw - 28px));right:14px;left:auto;top:78px;bottom:82px}
  .tool-rail{left:12px;top:126px}
  .view-controls{left:12px;top:88px}
  .coordinate-readout{left:12px;top:118px}
  .instrument{height:48px}
  .timeline-panel{left:10px;right:10px;width:auto}

vec4 mod289(vec4 x) {
  return x - floor(x * (1.0 / 289.0)) * 289.0;
}

float mod289(float x) {
  return x - floor(x * (1.0 / 289.0)) * 289.0;
}

vec4 permute(vec4 x) {
  return mod289(((x*34.0)+1.0)*x);
}

float permute(float x) {
  return mod289(((x*34.0)+1.0)*x);
}

vec4 taylorInvSqrt(vec4 r) {
  return 1.79284291400159 - 0.85373472095314 * r;
}

float taylorInvSqrt(float r) {
  return 1.79284291400159 - 0.85373472095314 * r;
}

vec4 grad4(float j, vec4 ip) {
  const vec4 ones = vec4(1.0, 1.0, 1.0, -1.0);
  vec4 p,s;

  p.xyz = floor( fract (vec3(j) * ip.xyz) * 7.0) * ip.z - 1.0;
  p.w = 1.5 - dot(abs(p.xyz), ones.xyz);
  s = vec4(lessThan(p, vec4(0.0)));
  p.xyz = p.xyz + (s.xyz*2.0 - 1.0) * s.www;

  return p;
}

float snoise(vec4 v) {

                        0.276393202250021,  // 2 * G4

  i0.yzw = 1.0 - isX;
  i0.y += isYZ.x + isYZ.y;
  i0.zw += 1.0 - isYZ.xx;
  i0.z += isYZ.z;
  i0.w += 1.0 - isYZ.z;

  vec4 i2 = clamp( i0-1.0, 0.0, 1.0 );

  vec4 x1 = x0 - i1 + C.xxxx;
  vec4 x2 = x0 - i2 + C.yyyy;
  vec4 x3 = x0 - i3 + C.zzzz;
  vec4 x4 = x0 + C.wwww;
