name: Native engine acceptance
on:
  push:
    branches: [agent/native-engine-journeys]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package exact review source
        run: git archive --format=tar.gz HEAD > /tmp/native-review-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: native-review-source
          path: /tmp/native-review-source.tar.gz
          retention-days: 7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm run lint && npm test && npm run build && npm run test:journeys
      - name: Install browser acceptance dependencies
        run: |
          python -m pip install -r field-studies-journeys/tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: GPU state, editor workflows, image and video decoding
        run: npm run test:gpu && npm run test:browser
      - name: Served native default and living artifact export
        run: python field-studies-journeys/tests/module_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-field-studies-review
          path: |
            dist/
            field-studies-journeys/field-studies.html
            field-studies-journeys/evidence-native/
            field-studies-journeys/docs/NATIVE_*.md
          retention-days: 14
