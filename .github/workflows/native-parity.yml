name: Expressions native parity
on:
  push:
    branches: [agent/expressions-native-parity]
  pull_request:
    branches: [agent/native-engine-journeys]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: expressions-parity-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record exact submitted revision
        run: |
          mkdir -p field-studies-journeys/evidence-native
          git rev-parse HEAD > field-studies-journeys/evidence-native/submitted-revision.txt
          git archive --format=tar.gz HEAD > /tmp/expressions-parity-source.tar.gz
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/Point-Cloud-Demo
          ref: 63e650d26a04447b973f73dded6b5046a0829e84
          path: .parity-reference/master
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/Point-Cloud-Demo
          ref: 040627d0ea40032fe7c7b8c98be9a246be9db7f6
          path: .parity-reference/main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - name: Share installed dependencies, not source
        run: |
          ln -s "$GITHUB_WORKSPACE/node_modules" .parity-reference/master/node_modules
          ln -s "$GITHUB_WORKSPACE/node_modules" .parity-reference/main/node_modules
      - name: Types, existing regressions, build and independent native contracts
        run: npm run lint && npm test && npm run build && npm run test:journeys && npm run test:parity
      - name: Install browser acceptance dependencies
        run: |
          python -m pip install -r field-studies-journeys/tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Existing GPU and approved workspace acceptance
        run: npm run test:gpu && npm run test:browser && npm run test:workspace
      - name: Independent GPU, restored workflows and default-allocation lifecycle
        run: npm run test:parity:browser
      - name: Real served applications and portable export
        run: |
          python field-studies-journeys/tests/module_browser.py
          npm run test:reference-apps
          npx tsx tests/parity/inventory.ts --verify
          git -C .parity-reference/master diff --exit-code
          git -C .parity-reference/main diff --exit-code
      - name: Build receipt
        if: always()
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          p=Path('field-studies-journeys/field-studies.html')
          receipt={'commit':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_ID'],'native_reference':'63e650d26a04447b973f73dded6b5046a0829e84','approved_shell':'9bf229dfeddfcacc3839f68662ec65e82afbd48b'}
          if p.exists(): receipt.update(html_sha256=hashlib.sha256(p.read_bytes()).hexdigest(),html_bytes=p.stat().st_size)
          Path('field-studies-journeys/evidence-native/build-receipt.json').write_text(json.dumps(receipt,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expressions-native-parity-review
          path: |
            dist/
            field-studies-journeys/field-studies.html
            field-studies-journeys/evidence-native/
            field-studies-journeys/docs/parity/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expressions-native-parity-source
          path: /tmp/expressions-parity-source.tar.gz
          retention-days: 14
