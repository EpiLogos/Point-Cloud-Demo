name: Publish reviewed Expressions workspace
on:
  push:
    branches: [agent/native-engine-journeys]
    paths: ['.expressions-review/**', '.github/workflows/publish-expressions-review.yml']
permissions:
  contents: write
jobs:
  publish:
    if: github.ref == 'refs/heads/agent/native-engine-journeys'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply checksum-verified reviewed source
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          staging = Path('.expressions-review')
          encoded = ''.join((staging / ('part' + str(i))).read_text() for i in range(2))
          payload = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(payload).hexdigest() == '0234232fe13de66badda702ccd5c5196c205898069be17c34b4ecac164b5dc34', 'Source transfer checksum mismatch'
          changes = json.loads(payload)
          assert len(changes) == 19
          for item in changes:
              path = Path(item['path'])
              assert not path.is_absolute() and '..' not in path.parts
              old = path.read_text(encoding='utf-8') if path.exists() else ''
              assert hashlib.sha256(old.encode()).hexdigest() == item['before'], 'Changed baseline: ' + str(path)
              for start, end, replacement in reversed(item['edits']):
                  old = old[:start] + replacement + old[end:]
              assert hashlib.sha256(old.encode()).hexdigest() == item['after'], 'Changed result: ' + str(path)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(old, encoding='utf-8')
          for part in staging.iterdir():
              part.unlink()
          staging.rmdir()
          Path('.github/workflows/publish-expressions-review.yml').unlink()
          print('Applied 19 exact locally tested source files; temporary publication inputs removed.')
          PY
      - run: npm ci --ignore-scripts
      - name: Types, regressions, production build and authoring models
        run: npm run lint && npm test && npm run build && npm run test:journeys
      - name: Install browser acceptance dependencies
        run: |
          python -m pip install -r field-studies-journeys/tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Actual GPU, capture, Expressions UI and mobile acceptance
        run: npm run test:gpu && npm run test:browser && npm run test:workspace
      - name: Served root and standalone export
        run: python field-studies-journeys/tests/module_browser.py
      - name: Publish tested source only to the reviewed branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refine Expressions library, orbital camera and canvas tools'
          git push origin HEAD:refs/heads/agent/native-engine-journeys
          git rev-parse HEAD > /tmp/expressions-published-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expressions-review
          path: |
            dist/
            field-studies-journeys/field-studies.html
            field-studies-journeys/evidence-native/
            field-studies-journeys/docs/EXPRESSION_UI_REVIEW.md
            /tmp/expressions-published-commit.txt
          retention-days: 14
