name: Semantic field rework
on:
  push:
    branches: [agent/semantic-field-cymatics-chakra-color]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: semantic-field-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package exact source
        run: git archive --format=tar.gz HEAD > /tmp/semantic-field-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-field-source
          path: /tmp/semantic-field-source.tar.gz
          retention-days: 14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - name: Engine, shell and build gates
        run: npm run lint && npm test && npm run build && npm run test:journeys
      - name: Install browser acceptance dependencies
        run: |
          python -m pip install -r field-studies-journeys/tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: GPU, workspace and full-allocation semantic acceptance
        run: |
          npm run test:gpu
          npm run test:workspace
          python field-studies-journeys/tests/semantic_field_browser.py
      - name: Full native browser, capture and portable-app acceptance
        run: |
          npm run test:browser
          python field-studies-journeys/tests/module_browser.py
      - name: Upload review build and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-field-review
          path: |
            dist/
            field-studies-journeys/field-studies.html
            field-studies-journeys/evidence-native/
            field-studies-journeys/docs/SEMANTIC_FIELD_*.md
          retention-days: 14
