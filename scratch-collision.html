<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Collision systems scratch — medium / SDF colliders / pairwise</title>
    <style>
      html, body { margin: 0; height: 100%; background: #09090b; overflow: hidden; }
      #field { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #panel {
        position: absolute; top: 12px; left: 12px; z-index: 10;
        font: 12px/1.6 ui-monospace, "SF Mono", Menlo, monospace;
        color: #e4e4e7; background: rgba(9,9,11,.82); border: 1px solid #27272a;
        border-radius: 8px; padding: 10px 12px; user-select: none;
      }
      #panel h1 { font-size: 12px; margin: 0 0 6px; color: #a1a1aa; font-weight: 600; letter-spacing: .04em; }
      #panel button {
        display: block; width: 100%; margin: 3px 0; text-align: left;
        font: inherit; color: #e4e4e7; background: #18181b; border: 1px solid #3f3f46;
        border-radius: 6px; padding: 4px 8px; cursor: pointer;
      }
      #panel button.on { background: #052e16; border-color: #16a34a; }
      #hint { color: #71717a; margin-top: 6px; max-width: 300px; }
    </style>
  </head>
  <body>
    <canvas id="field"></canvas>
    <div id="panel">
      <h1>COLLISION SCRATCH</h1>
      <button id="bMedium">Medium: OFF</button>
      <button id="bCollision">SDF walls: OFF</button>
      <button id="bPairwise">Pairwise: OFF</button>
      <button id="bMode">Mode: obstacle</button>
      <div id="hint">Click canvas = pulse. Hold + drag = repel. Drag particles through the letterform and watch the walls, the crowd pressure and the pile-ups.</div>
    </div>
    <script type="module">
      import { PointCloudField } from '/src/engine/PointCloudField.ts';
      import { DEFAULT_MEDIUM_CONFIG, DEFAULT_COLLISION_CONFIG, DEFAULT_PAIRWISE_CONFIG } from '/src/engine/PointCloudField.ts';

      const canvas = document.getElementById('field');
      const q = new URLSearchParams(location.search);
      const medium = { ...DEFAULT_MEDIUM_CONFIG, enabled: q.get('m') === '1' };
      const collision = { ...DEFAULT_COLLISION_CONFIG, enabled: q.get('c') === '1', mode: q.get('mode') === 'vessel' ? 'vessel' : 'obstacle' };
      const pairwise = { ...DEFAULT_PAIRWISE_CONFIG, enabled: q.get('p') === '1' };

      const field = new PointCloudField(canvas, {
        glyph: 'R',
        particleCount: 45000,
        colorMode: 'whiteOnBlack',
        backgroundColor: '#09090b',
        style: 'stipple',
        fluid: {
          curlScale: 1.4, curlSpeed: 0.8, vortexStrength: 0.4, viscosity: 0.94,
          returnSpeed: 1.0, turbulence: 0.7, dispersion: 0.4,
        },
        interaction: {
          radius: 220, strength: 1.6, mode: 'repel',
          clickMode: 'pulse', clickStrength: 2.4, clickRadius: 260,
        },
        medium, collision, pairwise,
      });

      const label = (on) => on ? 'ON' : 'OFF';
      const sync = () => {
        const cfg = { medium, collision, pairwise };
        field.updateConfig(cfg);
        bMedium.textContent = `Medium: ${label(medium.enabled)}`;
        bMedium.classList.toggle('on', medium.enabled);
        bCollision.textContent = `SDF walls: ${label(collision.enabled)}`;
        bCollision.classList.toggle('on', collision.enabled);
        bPairwise.textContent = `Pairwise: ${label(pairwise.enabled)}`;
        bPairwise.classList.toggle('on', pairwise.enabled);
        bMode.textContent = `Mode: ${collision.mode}`;
      };
      bMedium.onclick = () => { medium.enabled = !medium.enabled; sync(); };
      bCollision.onclick = () => { collision.enabled = !collision.enabled; sync(); };
      bPairwise.onclick = () => { pairwise.enabled = !pairwise.enabled; sync(); };
      bMode.onclick = () => { collision.mode = collision.mode === 'obstacle' ? 'vessel' : 'obstacle'; sync(); };
      sync();
    </script>
  </body>
</html>
